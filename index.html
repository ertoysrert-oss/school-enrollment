<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pré-Inscrição Escolar 2026/2027</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #e8eef7);
      color: #1f2937;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 28px;
      color: #123b6d;
      margin-bottom: 8px;
    }

    .header p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #25d366;
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .required {
      color: #dc2626;
    }

    .whatsapp-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 8px;
      background: #25d366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .whatsapp-button:hover {
      background: #1ebe5d;
      transform: translateY(-1px);
    }

    .info {
      margin-top: 18px;
      padding: 13px;
      background: #f0fdf4;
      border-radius: 10px;
      color: #166534;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #6b7280;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .container {
        margin: 10px auto;
      }

      .card {
        padding: 22px 18px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <h1>Pré-Inscrição Escolar</h1>
        <p>
          Preencha os dados abaixo para enviar uma pré-inscrição
          através do WhatsApp.
        </p>
      </div>

      <form id="enrollmentForm">

        <div class="form-group">
          <label for="responsavel">
            Nome do Responsável <span class="required">*</span>
          </label>
          <input
            type="text"
            id="responsavel"
            placeholder="Ex.: Maria Silva"
            required
          >
        </div>

        <div class="form-group">
          <label for="aluno">
            Nome do Aluno <span class="required">*</span>
          </label>
          <input
            type="text"
            id="aluno"
            placeholder="Ex.: João Silva"
            required
          >
        </div>

        <div class="form-group">
          <label for="idade">
            Idade do Aluno <span class="required">*</span>
          </label>
          <input
            type="number"
            id="idade"
            min="1"
            max="30"
            placeholder="Ex.: 8"
            required
          >
        </div>

        <div class="form-group">
          <label for="classe">
            Classe Pretendida <span class="required">*</span>
          </label>

          <select id="classe" required>
            <option value="">Selecione a classe</option>
            <option value="Iniciação">Iniciação</option>
            <option value="1ª Classe">1ª Classe</option>
            <option value="2ª Classe">2ª Classe</option>
            <option value="3ª Classe">3ª Classe</option>
            <option value="4ª Classe">4ª Classe</option>
            <option value="5ª Classe">5ª Classe</option>
            <option value="6ª Classe">6ª Classe</option>
            <option value="7ª Classe">7ª Classe</option>
            <option value="8ª Classe">8ª Classe</option>
            <option value="9ª Classe">9ª Classe</option>
            <option value="10ª Classe">10ª Classe</option>
            <option value="11ª Classe">11ª Classe</option>
            <option value="12ª Classe">12ª Classe</option>
      </select>
        </div>

        <div class="form-group">
          <label for="telefone">
            Telefone / WhatsApp <span class="required">*</span>
          </label>

          <input
            type="tel"
            id="telefone"
            placeholder="Ex.: +244 923 000 000"
            required
          >
        </div>

        <div class="form-group">
          <label for="municipio">
            Município / Região <span class="required">*</span>
          </label>

          <input
            type="text"
            id="municipio"
            placeholder="Ex.: Luanda"
            required
          >
        </div>

        <div class="form-group">
          <label for="mensagem">
            Mensagem adicional
          </label>

          <textarea
            id="mensagem"
            placeholder="Escreva aqui alguma informação adicional..."
          ></textarea>
        </div>

        <button type="submit" class="whatsapp-button">
          ENVIAR PRÉ-INSCRIÇÃO
        </button>

      </form>

      <div class="info">
        Após clicar no botão, o WhatsApp será aberto com
        os dados da pré-inscrição preenchidos automaticamente.
      </div>

    </div>

    <div class="footer">
      Pré-Inscrição Escolar 2026/2027
    </div>

  </div>

  <script>

    // Número provisório do WhatsApp da escola.
    // Será substituído pelo número real posteriormente.
    const whatsappNumber = "244000000000";

    document
      .getElementById("enrollmentForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const responsavel =
          document.getElementById("responsavel").value.trim();

        const aluno =
          document.getElementById("aluno").value.trim();

        const idade =
          document.getElementById("idade").value.trim();

        const classe =
          document.getElementById("classe").value;

        const telefone =
          document.getElementById("telefone").value.trim();

        const municipio =
          document.getElementById("municipio").value.trim();

        const mensagemExtra =
          document.getElementById("mensagem").value.trim();

        let mensagem =
`Nova Pré-Inscrição

Responsável: ${responsavel}
Aluno: ${aluno}
Idade: ${idade}
Classe: ${classe}
Telefone: ${telefone}
Município: ${municipio}`;

        if (mensagemExtra) {
          mensagem += `

Mensagem adicional: ${mensagemExtra}`;
        }

        const whatsappURL =
          "https://wa.me/" +
          whatsappNumber +
          "?text=" +
          encodeURIComponent(mensagem);

        window.open(whatsappURL, "_blank");

      });

  </script>

</body>
</html>
